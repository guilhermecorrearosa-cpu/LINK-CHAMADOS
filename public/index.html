<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Chamados - Mil Cópias</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Topo -->
  <div class="topo">
    <span class="topo-titulo">🖨️ Mil Cópias</span>
    <span class="topo-timer"><span id="contador">60</span>s</span>
  </div>

  <!-- Abas Principais -->
  <div class="tabs">
    <button class="tab-btn active" id="btn-sem-triagem" onclick="trocarAba('sem-triagem')">
      Sem Triagem <span class="badge-count badge-laranja" id="badgeSemTriagem">0</span>
    </button>
    <button class="tab-btn" id="btn-com-triagem" onclick="trocarAba('com-triagem')">
      Com Triagem <span class="badge-count badge-azul" id="badgeComTriagem">0</span>
    </button>
  </div>

  <!-- Sub-filtros para Status 00 e Status 01 -->
  <div class="sub-filtros" id="subFiltrosBar">
    <button class="sub-btn active" id="btnSubTodas" onclick="filtrarSubStatus('')">Todas (<span id="countSubTodas">0</span>)</button>
    <button class="sub-btn" id="btnSub00" onclick="filtrarSubStatus('00')">Status 00 (<span id="countSub00">0</span>)</button>
    <button class="sub-btn" id="btnSub01" onclick="filtrarSubStatus('01')">Status 01 (<span id="countSub01">0</span>)</button>
  </div>

  <!-- Busca -->
  <div class="busca">
    <input type="text" id="campoBusca" placeholder="🔍 Buscar OS, status, cliente, defeito..." onkeyup="filtrar()">
  </div>

  <!-- Listas Compactas -->
  <div class="lista">
    <div id="aba-sem-triagem" class="tab-conteudo active">
      <div class="vazio">Carregando chamados...</div>
    </div>
    <div id="aba-com-triagem" class="tab-conteudo">
      <div class="vazio">Carregando chamados...</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
